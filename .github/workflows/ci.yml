name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Lighthouse runs on Netlify, not here, so CI has no use for the Chrome its
# puppeteer dependency downloads on install
env:
  PUPPETEER_SKIP_DOWNLOAD: "1"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check .
      - run: npm test
      - run: npm run build
