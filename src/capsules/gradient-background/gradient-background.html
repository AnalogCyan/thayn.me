<!-- Animated gradient background with noise overlay -->

<div
  class="gradient-background"
  data-capsule="gradient-background"
  data-animated="{{animated}}"
  aria-hidden="true"
  role="presentation"
>
  <div class="gradient-blur-layer">
    <div class="gradient-node"></div>
    <div class="gradient-node"></div>
    <div class="gradient-node"></div>
    <div class="gradient-node"></div>
  </div>
  <div class="grain-overlay"></div>
</div>
