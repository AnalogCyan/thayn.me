<!-- Site header: the header capsule with the primary nav -->

<header class="container nav-center">
  <drop capsule="header" data-theme-key="thayn_theme">
    <li class="nav-pill__item">
      <a href="/" class="nav-pill__link" aria-label="Home" data-nav="home">
        <i class="ri-home-5-line" aria-hidden="true"></i>
        <span class="nav-pill__text">Home</span>
      </a>
    </li>
    <li class="nav-pill__item">
      <a
        href="/about"
        class="nav-pill__link"
        aria-label="About"
        data-nav="about"

        <i class="ri-user-heart-line" aria-hidden="true"></i>
        <span class="nav-pill__text">About</span>
      </a>

      <a href="/blog/" class="nav-pill__link" aria-label="Blog" data-nav="blog">

      </a>

    <li class="nav-pill__item">
      <a
        href="/projects"
        class="nav-pill__link"

    <li class="nav-pill__item">
      <a
        href="/music"
        class="nav-pill__link"

        <i class="ri-music-2-line" aria-hidden="true"></i>
        <span class="nav-pill__text">Music</span>
      </a>

    <li class="nav-pill__item">
      <a href="/more" class="nav-pill__link" aria-label="More" data-nav="more">
        <i class="ri-more-line" aria-hidden="true"></i>
        <span class="nav-pill__text">More</span>
      </a>
    </li>
  </drop>
</header>
